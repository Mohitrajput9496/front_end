<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .main{
        width: 200px;
        height: 200px;
        background-color: rgb(255, 240, 127);
        clip-path: polygon(50% 0%, 100% 50%,50% 100%, 0% 50%);
    }
    .hexa1{
        width: 200px;
        height: 200px;
        margin-top: 50px;
        background-color: rgb(134, 74, 158);
        clip-path: polygon(50% 0%,100% 39%, 83% 100%, 18% 100% ,0% 39%);
    }
    .hexa2{
        width: 200px;
        height: 200px;
        margin-top: 50px;
        background-color: rgb(80, 6, 28);
        clip-path: polygon(50% 0%, 100% 25% , 100% 75% , 50% 100% , 0% 75% , 0% 25%);
    }
    .hexa3{
        width: 200px;
        height: 200px;
        margin-top: 50px;
        background-color: rgb(0, 0, 0);
        clip-path: polygon(50% 0%, 100% 100% , 0% 100% );

    }
    .hexa4{
        width: 200px;
        height: 200px;
        margin-top: 50px;
        background-color: cadetblue;
        clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);    
        }
     .hexa5{
        width: 200px;
        height: 200px;
        margin-top: 50px;
        background-color: rgb(50, 15, 28);
        clip-path: polygon(40% 0%, 40% 20%, 100% 20%, 100% 80%, 40% 80%, 40% 100%, 0% 50%);
    }
     .hexa6{
        width: 200px;
        height: 200px;
        margin-top: 50px;
        background-color: rgb(157, 182, 168);
       clip-path: polygon(0% 20%, 60% 20%, 60% 0%, 100% 50%, 60% 100%, 60% 80%, 0% 80%);
   }
    .hexa7{
        width: 200px;
        height: 200px;
        margin-top: 50px;
        background-color: rgba(24, 14, 0, 0.46);
       clip-path: polygon(50% 0%, 100% 40%, 70% 40%, 70% 100%, 30% 100%, 30% 40%, 0% 40%);
   }
   .hexa8{
        width: 200px;
        height: 200px;
        margin-top: 50px;
        background-color: rgba(87, 123, 16, 0.46);
       clip-path: polygon(30% 0%, 70% 0%, 70% 60%, 100% 60%, 50% 100%, 0% 60%, 30% 60%);
   }
    .hexa9{
        width: 200px;
        height: 200px;
        margin-top: 50px;
        background-color: rgba(8, 1, 27, 0.46);
       clip-path: polygon(50% 0%, 60% 25%, 100% 25%, 80% 50%, 100% 75%, 60% 75%,  50% 100%,40% 75%, 0% 75%, 20% 50%, 0% 25%, 40% 25%);
   }
    
    
    
    
    
</style>
<body>
    <div class="main"></div>
    <div class="hexa1"></div>
    <div class="hexa2"></div>
    <div class="hexa3"></div>
    <div class="hexa4"></div>
    <div class="hexa5"></div>
    <div class="hexa6"></div>
    <div class="hexa7"></div>
    <div class="hexa8"></div>
    <div class="hexa9"></div>
</body>
</html>
