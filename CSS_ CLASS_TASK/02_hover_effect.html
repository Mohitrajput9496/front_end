<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .hover{
            width: 200px;
            border: 3px solid;
            text-align: center;
            padding: 20px;
            font-size: 30px;
            background-color:rgb(121,144,214);
            border-radius: 50px;
            font-family: Georgia, 'Times New Roman', Times, serif;

        }
        .hover:hover{
            margin: 50px;
            transform: scale(1,-2);
            transition: 1.2s;
            color: rgb(185, 193, 193);
            background-color: blue;
            rotate: 360deg;
            

        }
    </style>
</head>
<body>
    <div class=hover>
        HOVER
</div>
</body>
</html>
